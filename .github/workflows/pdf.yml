# Word → PDF for the orders board: every 5 minutes, converts the Word files queued with the «PDF» button.
name: PDF from Word
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: pdf-jobs
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Anything queued?
        id: q
        run: python3 .github/scripts/pdf_jobs.py check
      - name: Install LibreOffice and fonts
        if: steps.q.outputs.jobs != '0'
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer ttf-mscorefonts-installer fonts-liberation fonts-noto-cjk fontconfig >/dev/null
      - name: Convert
        if: steps.q.outputs.jobs != '0'
        run: python3 .github/scripts/pdf_jobs.py run
